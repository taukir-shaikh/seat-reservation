# Render blueprint: New -> Blueprint -> pick this repo.
# Creates the web service (from the Dockerfile) and a Postgres database.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
